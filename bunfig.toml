[test]
# Coverage is gated, but deliberately only over the PURE modules — the ones
# `bun test test/unit` loads. Bun instruments what it transpiles, so restricting
# the gated run to test/unit is what scopes the threshold: nothing under
# src/impure/ is ever loaded there, so it can neither raise nor lower the number.
#
# That split is the point. The browser-touching code is covered by
# test/integration (see bunfig.integration.toml), which runs a real Chrome and
# is NOT coverage-gated. Chasing 100% across a process-spawning, CDP-speaking
# codebase would mean testing mocks of Chrome rather than Chrome, and a green
# number built out of mocks is worse than an honest gap.
#
# NB: the threshold keys are plural (`lines`/`functions`). Bun silently ignores
# the singular spellings, which looks enforced but gates nothing.
coverage = true
coverageSkipTestFiles = true
coverageThreshold = { lines = 1.0, functions = 1.0 }
