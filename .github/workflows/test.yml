name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run quality

  # The suite above runs under Bun only, but Node is the target runtime — the
  # shipped bin's shebang is node. Without this, a Node-only break would only
  # surface at release time, or for a user.
  #
  # smoke:pack also exercises Deno, hence setup-deno here. The job keeps the id
  # `node` on purpose: it is a required status check, and renaming it would make
  # branch protection wait forever on a check that no longer runs.
  #
  # Neither job installs a Chrome engine. Both are deliberately engine-free, so
  # PR CI never spends an engine download and a minute on checks that are really
  # about module resolution and packaging.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x
      - run: bun install --frozen-lockfile
      - run: bun run smoke:node
      # Installs the packed tarball and runs it the way users get it, which
      # smoke:node can't — it runs the .ts from the checkout, where Node's type
      # stripping is allowed and node_modules' isn't. Gates Node, Bun and Deno.
      - run: bun run smoke:pack

  # The browser-touching half. Separated because it downloads the Chrome engine
  # (~190MB on disk; AGENTS.md carries the measurement), so it is worth seeing
  # fail on its own rather than as a slow flake inside the fast jobs.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Ubuntu 23.10+ (so every current runner) blocks unprivileged user
      # namespaces via AppArmor, and Chrome's sandbox needs them: without this
      # every launch dies with "No usable sandbox!".
      #
      # Re-enabling the namespaces is deliberate, in preference to the obvious
      # fix of passing --no-sandbox. bbb points a real browser at untrusted
      # pages, and the renderer sandbox is the main thing between a hostile page
      # and the host — so it stays on, and CI tests the same configuration real
      # users run. src/daemon.ts drops the sandbox only for uid 0, where Chrome
      # cannot use it at all; that path must not widen to "on CI" for
      # convenience.
      - name: Allow Chrome's sandbox to initialise
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun run cli.ts engine install stable
      # Against the compiled dist/ that npm actually ships, not the .ts source.
      # This is the half of the suite where source and build can genuinely
      # diverge: `bbb run` dynamic-imports a script, daemon.ts spawns a process,
      # and both go through the bundler's module graph. smoke:pack proves the
      # built binary runs; this proves it still behaves.
      #
      # Deliberately dist only, not dist *and* src. dist/ is built from src/, so
      # a source-level regression surfaces here too; a second Chrome cycle would
      # roughly double the slowest job to distinguish cases that `TARGET` and a
      # local `bun run test:integration` already separate. The source path keeps
      # its own gates: the coverage-gated unit suite, and smoke:node, which runs
      # the .ts from the checkout under Node.
      - run: bun run test:integration:dist
